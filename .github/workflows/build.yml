name: Compilar versión

# Compila los instaladores de Ensobre y los publica en este repositorio.
# El código fuente vive en un repositorio privado: se descarga solo durante
# la compilación con un token de SOLO LECTURA y no se publica.
# Los repositorios públicos no gastan minutos de GitHub Actions.
#
# Se lanza desde el repo privado al empujar una etiqueta "v1.2.3"
# (repository_dispatch) o a mano desde la pestaña Actions.
# Secretos (Settings → Secrets and variables → Actions):
#   SOURCE_TOKEN                        token fine-grained, "Contents: Read" solo sobre el repo privado
#   TAURI_SIGNING_PRIVATE_KEY           firma del actualizador
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  contraseña de esa firma

on:
  repository_dispatch:
    types: [build-release]
  workflow_dispatch:
    inputs:
      tag:
        description: "Etiqueta a compilar (p. ej. v0.1.6)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.client_payload.tag || inputs.tag }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Etiqueta (acepta "0.1.6" o "v0.1.6")
        env:
          RAW: ${{ github.event.client_payload.tag || inputs.tag }}
        shell: bash
        run: |
          RAW="$(echo "$RAW" | tr -d '[:space:]')"
          echo "TAG=v${RAW#v}" >> "$GITHUB_ENV"
      - name: Código fuente (repo privado, solo lectura)
        uses: actions/checkout@v4
        with:
          repository: xDAEKF4/Arca
          ref: ${{ env.TAG }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - name: Dependencias de Linux
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          owner: xDAEKF4
          repo: Arca-releases
          releaseCommitish: main
          includeUpdaterJson: true
          tagName: ${{ env.TAG }}
          releaseName: "Ensobre ${{ env.TAG }}"
          releaseBody: "Consulta las novedades en https://ensobre.com. Pago único, sin suscripción."
          releaseDraft: false
          args: ${{ matrix.args }}
